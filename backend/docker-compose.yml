version: '3.8'

services:
  sandbox:
    build: .
    container_name: code-sandbox
    restart: unless-stopped
    mem_limit: 256m
    cpu_shares: 512
    networks:
      - sandbox-network
    healthcheck:
      test: ["CMD", "python3", "-c", "print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sandbox-network:
    driver: bridge

